[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-monitor"
version = "0.1.0"
description = "Standalone LeRobot arm monitor: cameras, joints, teleop, record, rollout"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "rubatotree" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python>=4.9",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
cloud = ["httpx==0.28.1", "huggingface-hub==1.30.0"]

[project.scripts]
lerobot-monitor = "lerobot_monitor.__main__:main"
lerobot-cloud-manager = "lerobot_monitor.cloud_manager.__main__:main"
lerobot-monitor-cloud = "lerobot_monitor.cloud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_monitor = ["web/static/**/*", "robot_models/**/*", "cloud/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
