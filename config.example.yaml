# Example settings. Copy to config.yaml and adjust for your own devices.
# Cameras are probed locally (DirectShow / V4L). Enable a network stream in
# the Cameras panel; only those streams appear on the main grid.
# Set this when the Hugging Face cache lives outside its default location.
# huggingface_home: D:/Cache/huggingface

server:
  host: "127.0.0.1"
  port: 8090
  base_path: "/lerobot"

robot:
  type: so101_follower
  port: ""
  id: so101_follower
  # Directory containing <id>.json; keep it if calibration predates a cache move.
  # calibration_dir: D:/datasets/lerobot/calibration/robots/so_follower
  use_degrees: true
  auto_connect: false
  disable_torque_on_disconnect: true

virtual_follower:
  enabled: true
  auto_connect: true
  model_id: so101

leader:
  type: so101_leader
  port: ""
  id: so101_leader
  # calibration_dir: D:/datasets/lerobot/calibration/teleoperators/so_leader
  use_degrees: true
  auto_connect: false

cameras:
  probe: true
  max_probe: 8
  default_width: 640
  default_height: 480
  default_port_base: 5000

control:
  fps: 30
  hold_when_idle: true
  jog_duration_s: 2.5
  bus_release_s: 0.0

recording:
  root: data/videos
  fps: 15
  default_episode_time_s: 20
  default_reset_time_s: 5
  default_num_episodes: 50
  video_format: mp4
  merge: true
  streaming_encoding: true
  encoder_threads: 2

library:
  videos_root: data/videos
  dataset_roots:
    - data/datasets
  models_roots:
    - data/models
    - ../outputs

robot_models:
  root: data/robot_models
  max_file_mb: 128
  max_bundle_mb: 512

rollout:
  device: cpu
  default_duration_s: 60
  default_fps: 15
  # Receive-time checks, not camera exposure timestamps; tune for the task.
  observation_max_age_s: 1.0
  camera_max_skew_s: 0.25
  inference_timeout_s: 30.0
  rename_map:
    "observation.images.0": "observation.images.front"
